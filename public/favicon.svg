<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="60%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="leafSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#ecfdf5" stop-opacity="0.85" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#064e3b" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect width="512" height="512" rx="128" fill="url(#brandGradient)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="8" />

  <!-- Stylized Nutrition Leaf Icon with Glow & Detail -->
  <g filter="url(#shadow)">
    <!-- Main leaf body -->
    <path
      d="M380 132c-96.6 0-192 48.3-228.6 128.8-18.4 40.5-23.4 87.2-11.4 131.2 44-12 90.7-17 131.2-35.4C351.7 320 400 228.6 400 132c0-8.8-11.2-20-20-0z"
      fill="url(#leafSheen)"
    />
    <!-- Leaf vein -->
    <path
      d="M140 392c32-48 76-96 136-136 60-40 104-56 104-56"
      stroke="#059669"
      stroke-width="20"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Secondary small leaf / health sprout -->
    <path
      d="M188 280c-28-4-56 12-68 36-12 24-8 52 8 72 20 16 48 20 72 8 24-12 40-40 36-68-12-28-28-44-48-48z"
      fill="#ffffff"
      fill-opacity="0.75"
    />
  </g>
</svg>